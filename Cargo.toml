[package]
name = "intentrace"
version = "0.10.5"
description = "intentrace is strace with intent, it goes all the way for you instead of half the way."
edition = "2024"
license = "MIT"
repository = "https://github.com/sectordistrict/intentrace"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
ctrlc = { version = "3.5.2", features = ["termination"] }
if_chain = "1.0.3"
nix = { version = "0.31.3", features = ["ptrace", "uio", "signal"] }
num-traits = "0.2.19"
pete = { version = "0.13.0" }
procfs = "0.18.0"
syscalls = "0.8.1"
tabled = "0.22.0"
termbg = "0.6.2"
thousands = "0.2.0"
unicode-segmentation = "1.13.3"
uzers = "0.12.2"

# [profile.release]
# lto = true
